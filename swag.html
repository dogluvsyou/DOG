<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWAG // DOG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            padding: 20px 10px 60px 10px;
            overflow-x: hidden;
        }

        /* RETRO MINIMAL TOP NAVIGATION */
        .shop-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 10px auto;
            border-bottom: 1px dashed #000000;
            padding-bottom: 10px;
        }
        .back-home {
            font-family: "Tahoma", Arial, sans-serif;
            font-size: 0.8rem;
            color: #000000;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cart-status {
            font-family: monospace;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* BRAND MAIN HEADER CONTAINER */
        .brand-header {
            text-align: center;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .brand-header .brand-logo-img {
            width: 100%;
            max-width: 250px;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        /* HERO LOOKBOOK DISPLAY BANNER */
        .hero-lookbook-wrap {
            max-width: 800px;
            margin: 0 auto 40px auto;
            width: 100%;
            border: 1px solid #000000;
        }
        .hero-lookbook-wrap img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(1.05) brightness(0.95);
        }

        /* TEXT VIBE SPLITTERS */
        .vibe-divider {
            text-align: center;
            margin: 40px auto;
            max-width: 600px;
        }
        .vibe-divider .graphic-line {
            display: block;
            font-size: 14px;
            letter-spacing: 2px;
            color: #666666;
            margin-bottom: 10px;
            user-select: none;
        }
        .vibe-divider p {
            font-style: italic;
            font-size: 1.4rem;
            line-height: 1.4;
            color: #000000;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ASCII CONTROLLER BOX */
        .ascii-quote-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 25px auto;
            max-width: 1000px;
            padding: 0 10px;
        }

        .dog-ascii {
            font-family: monospace;
            font-size: 10px;
            line-height: 1.15;
            color: #000000;
            white-space: pre;
            user-select: none;
            text-align: left;
        }

        .ascii-quote-text {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 1.5rem;
            text-align: center;
            color: #000000;
            font-weight: bold;
            margin: 5px 0;
        }

        /* SHOP FEED ARCHITECTURE GRID */
        .shop-stream-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
